query getPoolsUniswapV3($first: Int!, $paramBlockNumber: Block_height, $pool_id: [String!]!) {
  pools(first: $first, block: $paramBlockNumber, where: { id_in: $pool_id }) {
    id
    fee
    tick
    liquidity
    token0 {
      id
      symbol
      decimals
    }
    token1 {
      id
      symbol
      decimals
    }
  }
}

query getPositionsUniswapV3All(
  $first: Int!
  $paramBlockNumber: Block_height
  $positions_id: Bytes!
  $pool_id: [String!]!
) {
  positions(
    first: $first
    block: $paramBlockNumber
    where: { id_gt: $positions_id, pool_in: $pool_id, liquidity_gt: 0 }
  ) {
    id
    owner
    pool {
      id
    }
    lowerTick
    upperTick
    liquidity
  }
}

query getPositionsUniswapV3WithAddress(
  $first: Int!
  $paramBlockNumber: Block_height
  $positions_id: Bytes!
  $pool_id: [String!]!
  $targetAddress: [String!]
) {
  positions(
    first: $first
    block: $paramBlockNumber
    where: { id_gt: $positions_id, pool_in: $pool_id, owner_in: $targetAddress, liquidity_gt: 0 }
  ) {
    id
    owner
    pool {
      id
    }
    lowerTick
    upperTick
    liquidity
  }
}
